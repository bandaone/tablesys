name: Backend CI/CD (Pytest & Coverage)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tablesys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-html pytest-cov hypothesis

    - name: Run Pytest with Coverage
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/tablesys_test
        JWT_SECRET_KEY: test_secret_key_123$!
      run: |
        mkdir -p reports
        pytest --cov=app --cov-report=xml --cov-report=term-missing --html=reports/api_audit.html --self-contained-html

    - name: Upload Test Report & Coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Backend-API-Audit-Report
        path: |
          backend/reports/api_audit.html
          backend/coverage.xml
        retention-days: 14
