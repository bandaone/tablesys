version: "3.8"

services:
  db-test:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: tablesys_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tablesys_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-test:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://admin:admin_password@db-test:5432/tablesys_test
      - ENVIRONMENT=test
      - SECRET_KEY=test_secret_key_which_is_more_than_32_characters
      - PYTHONPATH=/app
    depends_on:
      db-test:
        condition: service_healthy
    command: >
      sh -c "python -c \"from app.main import Base, engine; Base.metadata.create_all(bind=engine)\" && alembic stamp head && pytest tests/test_scheduler.py tests/test_saas_workstreams.py tests/test_institution_setup.py tests/test_exam_timetables.py"
