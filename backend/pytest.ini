[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Show extra test summary info
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=app
    --cov-report=term-missing
    --cov-report=html:reports/htmlcov
    --html=reports/api_audit.html
    --self-contained-html

# Markers for test categorization
markers =
    security: Security-related tests (rate limiting, headers, error handling)
    auth: Authentication and authorization tests
    api: API endpoint tests
    integration: Integration tests (end-to-end workflows)
    slow: Slow-running tests
    level1: Single course baseline test (Task 5)
    level2: Multiple courses test (Task 5)
    level3: Resource competition test (Task 5)
    level4: Realistic single year test (Task 5)
    level5: Full school scale test (Task 5)
    scaling: Solver scaling tests (Task 5)
